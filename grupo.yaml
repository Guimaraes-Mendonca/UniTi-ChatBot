# =============================================================================
#  CONFIGURAÇÃO DO GRUPO - preencha todos os campos marcados com TODO.
#  Este arquivo é lido pelo código base, pelo notebook e pelo script de
#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "UniTi"
  integrantes:          # 3 a 4 integrantes
    - nome: "Pedro Henrique Guimarães Mendonça"
      rga: "2025.1906.027-9"
    - nome: "joão Vitor limonges Bedadaque"
      rga: "2023.1906.039-9"
    - nome: "Caio Magno Borges Fernandes"
      rga: "2025.1906-048-1"
    - nome: "Jean Flávio Zapata Tezini"
      rga: "2025.1906.036-8"

tema:
  nome: "UniTi - Chat Bot de Assistência com Tecnologias Acadêmicasr"
  descricao: >
    chatbot para ajudar alunos da UFMS com problemas relacionados as tecnologias oferecidas pela universidade

dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona: >
    "Você é o UniTi, assistente virtual do Ajuda tecnica da UFMS. Seja formal, simples, respeitoso e direto."
  contato: "suporte.agetic@ufms.br"
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").

intencoes:
  wifi:
    descricao: "Ajuda com acesso e configuração da rede Wi-Fi institucional Eduroam."
    resposta: >
      Posso ajudar com o acesso ao Wi-Fi institucional da UFMS.
      Consulte os tutoriais de configuração da rede Eduroam disponíveis
      na base de documentos.

  email:
    descricao: "Ajuda com acesso e configuração do e-mail institucional."
    resposta: >
      Posso ajudar com o acesso e a configuração do e-mail institucional.
      Consulte os tutoriais de configuração disponíveis na base de documentos.

  senha:
    descricao: "Ajuda com recuperação e alteração de senha do Passaporte UFMS."
    resposta: >
      Posso ajudar com questões relacionadas à senha do Passaporte UFMS.
      Consulte as orientações disponíveis na documentação do Passaporte UFMS.

  ava:
    descricao: "Ajuda com acesso ao Ambiente Virtual de Aprendizagem."
    resposta: >
      Posso ajudar com dúvidas sobre o acesso ao AVA.
      Consulte os materiais de orientação disponíveis ou os canais
      oficiais de suporte da UFMS.

  sistemas:
    descricao: "Ajuda com acesso e utilização dos sistemas acadêmicos e institucionais."
    resposta: >
      Posso ajudar com dúvidas sobre os sistemas institucionais da UFMS.
      Consulte os tutoriais disponíveis na base de documentos.

  suporte:
    descricao: "Orientações sobre problemas técnicos, VPN e canais de suporte de TI."
    resposta: >
      Posso orientar sobre problemas técnicos relacionados aos serviços
      institucionais, incluindo acesso por VPN. Para obter atendimento,
      consulte os canais oficiais de suporte da AGETIC/UFMS.

  videoconferencia:
    descricao: "Ajuda com utilização de ferramentas de conferência pela Web."
    resposta: >
      Posso ajudar com dúvidas sobre conferências pela Web.
      Consulte o Manual de Conferência Web disponível na base de documentos.

  google_drive:
    descricao: "Ajuda com transferência de arquivos e utilização de drives compartilhados do Google Workspace."
    resposta: >
      Posso ajudar com dúvidas sobre transferência de arquivos e drives
      compartilhados. Consulte os tutoriais do Google Workspace disponíveis
      na base de documentos.

  sei:
    descricao: "Ajuda com procedimentos e utilização do Sistema Eletrônico de Informações."
    resposta: >
      Posso ajudar com dúvidas sobre o SEI. Consulte o procedimento geral
      do Sistema Eletrônico de Informações disponível na base de documentos.

  autenticacao:
    descricao: "Ajuda com configuração e utilização da autenticação de dois fatores do Gmail."
    resposta: >
      Posso ajudar com dúvidas sobre autenticação de dois fatores do Gmail.
      Consulte o tutorial disponível na base de documentos.


# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Olá! Como posso ajudar?"
    agradecimento: "Por nada!"
    despedida: "Até logo!"
    padrao: "Sou um assistente automático e posso ajudar com: {assuntos}."
  fora_dominio: "Desculpe, não sei responder sobre isso. Posso ajudar com: {assuntos}."
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"
